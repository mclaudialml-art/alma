<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Alma</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#16151b}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#fff}
  .gate{display:none;min-height:100%;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;
        background:linear-gradient(135deg,#ffb4d8 0%,#d6a9ff 45%,#a8b8ff 100%)}
  .box{background:#fff;border-radius:28px;padding:28px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(80,40,160,.25)}
  .box img{width:84px;height:84px;border-radius:22px}
  h1{font-size:22px;margin:14px 0 6px}
  p{font-size:14px;color:#6d6979;margin:0 0 18px}
  input{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:14px;border-radius:14px;border:1.5px solid #e7e5ee;background:#f6f5fa;text-align:center;letter-spacing:1px}
  button{margin-top:12px;width:100%;font:inherit;font-weight:700;padding:14px;border:0;border-radius:14px;background:#16151b;color:#fff}
  .err{color:#e5484d;font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <img src="icon-180.png" alt="">
    <h1>Hola, Clau 👋</h1>
    <p>Escribe tu clave de Alma. Solo te la pido esta vez.</p>
    <input id="k" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Clave">
    <button onclick="guardar()">Entrar</button>
    <div class="err" id="err"></div>
  </div>
</div>
<script>
  var APP = 'https://script.google.com/macros/s/AKfycbzc0pF66SIhA6hUHXOkBppm9p9RvE-iCmEtYkKAcN8uM_qpr5_lAN7xHM6IxxA40Bsi/exec';
  function leer(){ try { return localStorage.getItem('almaKey') || ''; } catch (e) { return ''; } }
  function abrir(k){
    var f = document.createElement('iframe');
    f.src = APP + '?k=' + encodeURIComponent(k);
    f.setAttribute('allow', 'clipboard-write');
    document.body.appendChild(f);
  }
  function guardar(){
    var k = document.getElementById('k').value.trim();
    if (k.length < 8) { document.getElementById('err').textContent = 'Esa clave no parece correcta.'; return; }
    try { localStorage.setItem('almaKey', k); } catch (e) {}
    document.getElementById('gate').style.display = 'none';
    abrir(k);
  }
  // Para cambiar la clave: abre esta página con #salir
  if (location.hash === '#salir') { try { localStorage.removeItem('almaKey'); } catch (e) {} history.replaceState(null, '', location.pathname); }
  var k = leer();
  if (k) abrir(k); else document.getElementById('gate').style.display = 'flex';
</script>
</body>
</html>
